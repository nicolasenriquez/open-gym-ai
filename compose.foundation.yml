# Standalone synthetic stack. Use environment.mjs, not the instance Compose file.
name: opengym-foundation-test
services:
  foundation-db:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: foundation_bootstrap
      POSTGRES_PASSWORD: synthetic-foundation-only
      POSTGRES_DB: foundation_test
    labels:
      org.opengym.foundation: synthetic
    networks: [private]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, foundation_bootstrap, -d, foundation_test]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"

  foundation-test:
    build:
      context: ./api/foundation
      args:
        NODE_IMAGE: node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PGHOST: foundation-db
      PGPORT: "5432"
      PGDATABASE: foundation_test
      PGUSER: foundation_bootstrap
      PGPASSWORD: synthetic-foundation-only
    labels:
      org.opengym.foundation: synthetic
    networks: [private]
    depends_on:
      foundation-db:
        condition: service_healthy
    restart: "no"

networks:
  private:
    internal: true
    labels:
      org.opengym.foundation: synthetic

volumes:
  postgres-data:
    labels:
      org.opengym.foundation: synthetic
