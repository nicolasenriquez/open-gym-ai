name: Tests

on:
  pull_request:
  push:
    branches: [main, coach]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint:ci
      - run: node scripts/build-api-docs.mjs --check
      - name: Audit every current JavaScript lock
        run: |
          pnpm audit
          pnpm --dir frontend audit
      - run: docker build -f backend/Dockerfile.security -t opengym-security:ci .
      - name: Workflow security (offline)
        run: docker run --rm --network none --read-only --tmpfs /tmp opengym-security:ci zizmor --offline .github/workflows
      - name: Python source security
        run: docker run --rm --network none --read-only --tmpfs /tmp opengym-security:ci bandit -r src -ll -ii
      - name: Audit locked Python application, development and security dependencies
        run: |
          docker run --rm --read-only --tmpfs /tmp opengym-security:ci sh -ec '
            uv export --locked --all-groups --no-emit-project --output-file /tmp/application.txt >/dev/null
            uv export --project /tools --locked --no-emit-project --output-file /tmp/security.txt >/dev/null
            pip-audit --require-hashes --disable-pip -r /tmp/application.txt
            pip-audit --require-hashes --disable-pip -r /tmp/security.txt
          '

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # CodeQL uploads SARIF to code scanning; no other job gets write access.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/docs/okf.mjs check
      - run: node --test scripts/docs/okf.test.mjs

  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Validate the catalogue
        run: node scripts/catalogue/validate.mjs
      - name: Generated files are up to date
        run: node scripts/catalogue/build.mjs --check
      - run: node --test scripts/catalogue/build.test.mjs
      - name: Media stay within 180 px (licence)
        run: node scripts/catalogue/check-media.mjs


  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.8
      # Node 22 builds the web/client tools; the API runtime is Python.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: pnpm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      # check-locales compares the packs to each other, so a key missing from ALL of them is
      # invisible to it. This walks src/ instead. Report-only for now: there is a known
      # backlog of untranslated demo-view strings to clear before it can fail the build.
      - run: node scripts/check-source-strings.mjs
        working-directory: frontend
      # The fatigue model must never read higher after a rest day than before it.
      # Property probe over ~108k comparisons; too slow for the unit suite, cheap here.
      - run: pnpm run test:fatigue-probe
        working-directory: frontend


  platform-suites:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { group: foundation, minutes: 40 }
          - { group: identity, minutes: 40 }
          - { group: training, minutes: 40 }
          - { group: services, minutes: 40 }
          - { group: backup, minutes: 40 }
          - { group: cutover, minutes: 40 }
          - { group: restore, minutes: 40 }
          - { group: images, minutes: 75 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        id: platform-builder
        with:
          driver-opts: image=moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5
      # Layer caches are image-scoped; download cache mounts stay builder-local.
      # No image is pushed. A cache failure never bypasses the proofs.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          target: test
          push: false
          cache-from: type=gha,scope=platform-test
          cache-to: type=gha,scope=platform-test,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile.client
          push: false
          cache-from: type=gha,scope=platform-client
          cache-to: type=gha,scope=platform-client,mode=max
      - run: node --test scripts/docker-build-context.test.mjs
        if: matrix.group == 'foundation'
      - run: node --test scripts/docker-layout.test.mjs
        if: matrix.group == 'foundation'
      - run: node scripts/platform.mjs verify harness
        if: matrix.group == 'foundation'
      - run: node scripts/platform.mjs verify database
        if: matrix.group == 'foundation'
      - run: node scripts/platform.mjs verify checks
        if: matrix.group == 'foundation'
      - run: node scripts/platform.mjs verify schema
        if: matrix.group == 'foundation'
      - run: node scripts/platform.mjs verify lifecycle
        if: matrix.group == 'foundation'
      - run: node scripts/platform.mjs verify identity_session
        if: matrix.group == 'identity'
      - run: node scripts/platform.mjs verify identity_password
        if: matrix.group == 'identity'
      - run: node scripts/platform.mjs verify identity_register
        if: matrix.group == 'identity'
      - run: node scripts/platform.mjs verify identity_passkey
        if: matrix.group == 'identity'
      - run: node scripts/platform.mjs verify identity_account
        if: matrix.group == 'identity'
      - run: node scripts/platform.mjs verify identity_reset
        if: matrix.group == 'identity'
      - run: node scripts/platform.mjs verify identity_links
        if: matrix.group == 'identity'
      - run: node scripts/platform.mjs verify training_read
        if: matrix.group == 'training'
      - run: node scripts/platform.mjs verify training_write
        if: matrix.group == 'training'
      - run: node scripts/platform.mjs verify training_browser
        if: matrix.group == 'training'
      - run: node scripts/platform.mjs verify media --case roundtrip
        if: matrix.group == 'training'
      - run: node scripts/platform.mjs verify media --case quota_and_missing
        if: matrix.group == 'training'
      - run: node scripts/platform.mjs verify media_gc --case fail_safe
        if: matrix.group == 'training'
      - run: node scripts/platform.mjs verify coach_state
        if: matrix.group == 'services'
      - run: node scripts/platform.mjs verify coach_http --case validated_proposal
        if: matrix.group == 'services'
      - run: node scripts/platform.mjs verify coach_admin --case credentials
        if: matrix.group == 'services'
      - run: node scripts/platform.mjs verify admin_audit --case failure_and_retention
        if: matrix.group == 'services'
      - run: node scripts/platform.mjs verify admin_invites --case consumed_history
        if: matrix.group == 'services'
      - run: node scripts/platform.mjs verify admin_users --case actor_target
        if: matrix.group == 'services'
      - run: node scripts/platform.mjs verify admin_delete
        if: matrix.group == 'services'
      - run: node scripts/platform.mjs verify notifications
        if: matrix.group == 'services'
      - run: node scripts/platform.mjs verify diagnostics
        if: matrix.group == 'backup'
      - run: node scripts/platform.mjs verify import
        if: matrix.group == 'backup'
      - run: node scripts/platform.mjs verify backup
        if: matrix.group == 'backup'
      - run: node scripts/platform.mjs verify gates --case pre_cutover
        if: matrix.group == 'cutover'
      - run: node scripts/platform.mjs verify gates --case authorized_cutover
        if: matrix.group == 'cutover'
      - run: node scripts/platform.mjs verify gates --case node_capture
        if: matrix.group == 'cutover'
      - run: node --test scripts/platform-node-drain-docker.test.mjs
        if: matrix.group == 'cutover'
      - run: node scripts/platform.mjs verify gates --case node_capture_import
        if: matrix.group == 'cutover'
      - run: node scripts/platform.mjs verify gates --case node_capture_recovery
        if: matrix.group == 'cutover'
      - run: node scripts/platform.mjs verify repair --case acknowledged_writes
        if: matrix.group == 'restore'
      - run: node scripts/platform.mjs verify restore --case isolated_target
        if: matrix.group == 'restore'
      - run: node scripts/platform.mjs verify restore --case reviewed_access
        if: matrix.group == 'restore'
      - run: node scripts/platform.mjs verify restore --case full_timing
        if: matrix.group == 'restore'
      - run: node scripts/platform.mjs verify images --case reproducibility
        if: matrix.group == 'images'
      - run: node scripts/platform.mjs verify contracts --case python_routes
        if: matrix.group == 'foundation'
      - run: node scripts/platform.mjs verify shared_client --case canonical_sources
        if: matrix.group == 'foundation'
      - run: node scripts/platform.mjs verify shared_client --case formats_and_bundles
        if: matrix.group == 'foundation'

  platform:
    if: always()
    needs: platform-suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform group
        env:
          RESULT: ${{ needs.platform-suites.result }}
        run: test "$RESULT" = success
