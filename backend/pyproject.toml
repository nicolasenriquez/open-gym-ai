[project]
name = "opengym-platform"
version = "0.0.0"
description = "OpenGym Python platform"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-or-later"
dependencies = [
  "fastapi==0.161.1",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "asyncpg==0.32.0",
  "httpx==0.28.1",
  "webauthn==3.0.1",
  "alembic==1.20.1",
  "sqlalchemy[asyncio]==2.1.6",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.2",
  "mypy==2.4.0",
]

# asyncpg ships no typing marker; keep the exception local to that driver.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
