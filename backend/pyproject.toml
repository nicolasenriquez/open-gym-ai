[project]
name = "opengym-platform"
version = "0.0.0"
description = "Isolated synthetic Python Foundation tooling"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-or-later"
dependencies = [
  "fastapi==0.161.1",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "sqlalchemy==2.1.6",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.17.2",
  "mypy==2.4.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
