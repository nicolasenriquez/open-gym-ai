global(workDirectory="/state" maxMessageSize="8k")
module(load="imuxsock" SysSock.Use="off")
module(load="imudp")
main_queue(queue.type="FixedArray" queue.size="256" queue.timeoutEnqueue="0")
template(name="api" type="string" string="%msg%\n")
template(name="nginx" type="string" string="{\"service\":\"nginx\",\"event\":\"native\",\"severity\":\"%syslogseverity-text%\"}\n")
template(name="postgres" type="string" string="{\"service\":\"postgres\",\"event\":\"native\",\"severity\":\"%syslogseverity-text%\"}\n")
template(name="ops" type="string" string="{\"service\":\"ops\",\"event\":\"native\",\"severity\":\"%syslogseverity-text%\"}\n")
ruleset(name="native") {
 if $programname == "opengym-nginx" then {
  action(type="omfile" file="/logs/nginx.log" template="nginx" fileCreateMode="0600" rotation.sizeLimit="360448" rotation.sizeLimitCommand="/usr/local/bin/rotate")
  stop
 }
 if $programname == "opengym-postgres" then {
  action(type="omfile" file="/logs/postgres.log" template="postgres" fileCreateMode="0600" rotation.sizeLimit="360448" rotation.sizeLimitCommand="/usr/local/bin/rotate")
  stop
 }
 action(type="omfile" file="/logs/ops.log" template="ops" fileCreateMode="0600" rotation.sizeLimit="360448" rotation.sizeLimitCommand="/usr/local/bin/rotate")
}
ruleset(name="local") {
 if $programname == "opengym-api" then {
  action(type="omfile" file="/logs/api.log" template="api" fileCreateMode="0600" rotation.sizeLimit="360448" rotation.sizeLimitCommand="/usr/local/bin/rotate")
  stop
 }
 call native
}
input(type="imuxsock" Socket="/run/diagnostics/log" RateLimit.Interval="0" Ruleset="local")
input(type="imudp" port="5514" ruleset="native")
