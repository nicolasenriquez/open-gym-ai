# Select an explicit dev/ops overlay and --env-file; never combine with the Node stack.
name: opengym-ops
x-database: &database
  PLATFORM_ENV: ops
  PLATFORM_DB_MODE: local_compose
  PLATFORM_DB_HOST: db
  PLATFORM_DB_PORT: "5432"
  PLATFORM_DB_NAME: opengym
  PLATFORM_DB_TLS: disable
  PLATFORM_DB_PASSWORD_FILE: /run/secrets/database_password
x-python: &python
  platform: linux/amd64
  user: "1000:1000"
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,mode=1777,size=67108864"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  logging: {driver: none}
services:
  diagnostics:
    <<: *python
    image: ${PLATFORM_DIAGNOSTICS_IMAGE:-opengym-platform-diagnostics:unselected}
    volumes: [diagnostic-logs:/logs, diagnostic-socket:/run/diagnostics]
    tmpfs: ["/state:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0700,size=1048576"]
    networks:
      diagnostics: {ipv4_address: "${PLATFORM_DIAGNOSTICS_IP:-10.253.245.2}"}
    healthcheck:
      test: [CMD, python, -c, "import pathlib; assert pathlib.Path('/state/ready').is_file()"]
      interval: 1s
      timeout: 2s
      retries: 30
  web:
    image: ${PLATFORM_WEB_IMAGE:-opengym-platform-web:unselected}
    platform: linux/amd64
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=67108864
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,mode=1777,size=1048576
      - /var/cache/nginx:rw,noexec,nosuid,nodev,mode=1777,size=16777216
    environment: {BACKEND: api, PORT: "3000", NGINX_PORT: "80"}
    ports: ["127.0.0.1:${PLATFORM_WEB_PORT:-8080}:80"]
    networks: [app]
    restart: "no"
    logging:
      driver: syslog
      options:
        syslog-address: "udp://${PLATFORM_DIAGNOSTICS_IP:-10.253.245.2}:5514"
        tag: opengym-nginx
        mode: non-blocking
        max-buffer-size: 1m
        cache-disabled: "true"
  api:
    <<: *python
    image: ${PLATFORM_RUNTIME_IMAGE:-opengym-platform-runtime:unselected}
    command: ["-m", "uvicorn", "opengym_platform.application:create_app", "--factory", "--host", "0.0.0.0", "--port", "3000", "--workers", "1", "--no-access-log", "--no-proxy-headers"]
    environment:
      <<: *database
      PLATFORM_SESSION_SECRET_FILE: /run/secrets/session_secret
      PLATFORM_COACH_SECRET_FILE: /run/secrets/coach_secret
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SESSION_DAYS: ${SESSION_DAYS:-90}
      INVITE_ONLY: ${INVITE_ONLY:-0}
      ALLOW_GUEST: ${ALLOW_GUEST:-1}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-0}
      COACH_DISABLED: ${COACH_DISABLED:-0}
      DEFAULT_LANG: ${DEFAULT_LANG:-}
      ALLOWED_PRIVATE_IPS: ${ALLOWED_PRIVATE_IPS:-}
      MEDIA_UPLOADS: ${MEDIA_UPLOADS:-1}
      MEDIA_QUOTA_MB: ${MEDIA_QUOTA_MB:-200}
      MEDIA_IMAGE_MAX_MB: ${MEDIA_IMAGE_MAX_MB:-2}
      MEDIA_GIF_MAX_MB: ${MEDIA_GIF_MAX_MB:-8}
      MEDIA_VIDEO_MAX_MB: ${MEDIA_VIDEO_MAX_MB:-40}
      MEDIA_VIDEO_MAX_SEC: ${MEDIA_VIDEO_MAX_SEC:-60}
      MEDIA_UPLOADS_PER_HOUR: ${MEDIA_UPLOADS_PER_HOUR:-600}
      MEDIA_MIN_FREE_MB: ${MEDIA_MIN_FREE_MB:-512}
      MEDIA_GC_GRACE_DAYS: ${MEDIA_GC_GRACE_DAYS:-14}
      DATA_DIR: /data
      PLATFORM_LOG_SOCKET: /run/diagnostics/log
      PLATFORM_LOG_DIRECTORY: /run/diagnostic-logs
      PLATFORM_DIAGNOSTIC_SOCKET: /run/diagnostics/api-status.sock
    volumes: [media-data:/data, diagnostic-socket:/run/diagnostics, diagnostic-logs:/run/diagnostic-logs:ro]
    secrets:
      - {source: runtime_password, target: database_password}
      - session_secret
      - coach_secret
    networks: [app, database]
    depends_on:
      db: {condition: service_healthy}
      diagnostics: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/v1/health/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30
  db:
    <<: *python
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    command: [postgres, -c, logging_collector=off, -c, log_destination=stderr, -c, log_statement=none, -c, log_min_error_statement=panic]
    depends_on:
      diagnostics: {condition: service_healthy}
    environment:
      POSTGRES_USER: opengym_platform_bootstrap
      POSTGRES_DB: opengym
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - {source: bootstrap_password, target: database_password}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=67108864
      - /var/run/postgresql:rw,noexec,nosuid,nodev,mode=1777,size=16777216
    volumes: [postgres-data:/var/lib/postgresql]
    networks: [database]
    logging:
      driver: syslog
      options:
        syslog-address: "udp://${PLATFORM_DIAGNOSTICS_IP:-10.253.245.2}:5514"
        tag: opengym-postgres
        mode: non-blocking
        max-buffer-size: 1m
        cache-disabled: "true"
    healthcheck:
      test: [CMD, pg_isready, -U, opengym_platform_bootstrap, -d, postgres]
      interval: 1s
      timeout: 3s
      retries: 30
  migrate:
    <<: *python
    image: ${PLATFORM_MIGRATE_IMAGE:-opengym-platform-migrate:unselected}
    profiles: [tools]
    environment: *database
    secrets:
      - {source: migrator_password, target: database_password}
    networks: [database]
    depends_on:
      db: {condition: service_healthy}
  bootstrap:
    <<: *python
    image: ${PLATFORM_MIGRATE_IMAGE:-opengym-platform-migrate:unselected}
    profiles: [setup]
    command: ["--deployment", "bootstrap"]
    environment:
      <<: *database
      PLATFORM_MIGRATOR_PASSWORD_FILE: /run/secrets/migrator_password
      PLATFORM_RUNTIME_PASSWORD_FILE: /run/secrets/runtime_password
    secrets:
      - {source: bootstrap_password, target: database_password}
      - migrator_password
      - runtime_password
    networks: [database]
    depends_on:
      db: {condition: service_healthy}
  ops:
    <<: *python
    image: ${PLATFORM_OPS_IMAGE:-opengym-platform-ops:unselected}
    profiles: [tools]
    networks: [database]
    volumes: [diagnostic-socket:/run/diagnostics:ro]
    configs: [{source: operator_config, target: /run/operator/config.json}]
configs:
  operator_config: {file: ./deploy/operator.json}
networks:
  app: {}
  database: {internal: true}
  diagnostics:
    internal: true
    ipam:
      config: [{subnet: "${PLATFORM_DIAGNOSTICS_SUBNET:-10.253.245.0/29}"}]
volumes:
  diagnostic-logs:
    name: ${COMPOSE_PROJECT_NAME}_ops-diagnostic-logs
  diagnostic-socket:
    name: ${COMPOSE_PROJECT_NAME}_ops-diagnostic-socket
  media-data:
    name: ${COMPOSE_PROJECT_NAME}_ops-media-data
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME}_ops-postgres-data
secrets:
  bootstrap_password: {file: "${PLATFORM_SECRETS_DIR:?set a private absolute secret directory}/bootstrap_password"}
  migrator_password: {file: "${PLATFORM_SECRETS_DIR:?set a private absolute secret directory}/migrator_password"}
  runtime_password: {file: "${PLATFORM_SECRETS_DIR:?set a private absolute secret directory}/runtime_password"}
  session_secret: {file: "${PLATFORM_SECRETS_DIR:?set a private absolute secret directory}/session_secret"}
  coach_secret: {file: "${PLATFORM_SECRETS_DIR:?set a private absolute secret directory}/coach_secret"}
