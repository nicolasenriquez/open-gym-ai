# Disposable Platform verification only; use scripts/platform.mjs, never instance settings.
name: opengym-platform-test
services:
  platform-db:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=67108864
      - /var/run/postgresql:rw,noexec,nosuid,nodev,mode=1777,size=16777216
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: opengym_platform_bootstrap
      POSTGRES_PASSWORD: synthetic-opengym-platform-only
      POSTGRES_DB: opengym_platform_test
    labels:
      org.opengym.platform: synthetic
    networks:
      private:
        aliases: [db]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, opengym_platform_bootstrap, -d, opengym_platform_test]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"

  platform-test:
    image: ${COMPOSE_PROJECT_NAME}-platform-test:local
    platform: linux/amd64
    build:
      context: ./backend
      target: test
      labels:
        org.opengym.platform: synthetic
        com.docker.compose.project: ${COMPOSE_PROJECT_NAME}
        com.docker.compose.service: platform-test
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,mode=1777,size=67108864"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint:
      ["/app/.venv/bin/python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "--tb=short"]
    environment:
      PLATFORM_DB_HOST: platform-db
      PLATFORM_DB_PORT: "5432"
      PLATFORM_DB_NAME: opengym_platform_test
      PLATFORM_DB_USER: opengym_platform_bootstrap
      PLATFORM_DB_PASSWORD: synthetic-opengym-platform-only
    labels:
      org.opengym.platform: synthetic
    networks: [private]
    depends_on:
      platform-db:
        condition: service_healthy
    restart: "no"

  platform-contracts:
    image: ${COMPOSE_PROJECT_NAME}-platform-contracts:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile.contracts
      labels:
        org.opengym.platform: synthetic
        com.docker.compose.project: ${COMPOSE_PROJECT_NAME}
        com.docker.compose.service: platform-contracts
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,mode=1777,size=268435456"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      org.opengym.platform: synthetic
    networks: [private]
    restart: "no"

networks:
  private:
    internal: true
    labels:
      org.opengym.platform: synthetic
      com.docker.compose.service: private

volumes:
  postgres-data:
    labels:
      org.opengym.platform: synthetic
      com.docker.compose.service: platform-db
