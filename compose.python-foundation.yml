# Synthetic stack only. Use scripts/python-foundation.mjs, never the instance Compose file.
name: opengym-python-foundation-test
services:
  foundation-db:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=67108864
      - /var/run/postgresql:rw,noexec,nosuid,nodev,mode=1777,size=16777216
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: python_foundation_bootstrap
      POSTGRES_PASSWORD: synthetic-python-foundation-only
      POSTGRES_DB: python_foundation_test
    labels:
      org.opengym.python-foundation: synthetic
    networks: [private]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, python_foundation_bootstrap, -d, python_foundation_test]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"

  foundation-test:
    image: ${COMPOSE_PROJECT_NAME}-foundation-test:local
    build:
      context: ./backend
      labels:
        org.opengym.python-foundation: synthetic
        com.docker.compose.project: ${COMPOSE_PROJECT_NAME}
        com.docker.compose.service: foundation-test
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,mode=1777,size=67108864"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      FOUNDATION_DB_HOST: foundation-db
      FOUNDATION_DB_PORT: "5432"
      FOUNDATION_DB_NAME: python_foundation_test
      FOUNDATION_DB_USER: python_foundation_bootstrap
      FOUNDATION_DB_PASSWORD: synthetic-python-foundation-only
    labels:
      org.opengym.python-foundation: synthetic
    networks: [private]
    depends_on:
      foundation-db:
        condition: service_healthy
    restart: "no"

  foundation-contracts:
    image: ${COMPOSE_PROJECT_NAME}-foundation-contracts:local
    build:
      context: .
      dockerfile: backend/Dockerfile.contracts
      labels:
        org.opengym.python-foundation: synthetic
        com.docker.compose.project: ${COMPOSE_PROJECT_NAME}
        com.docker.compose.service: foundation-contracts
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,mode=1777,size=268435456"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      org.opengym.python-foundation: synthetic
    networks: [private]
    restart: "no"

networks:
  private:
    internal: true
    labels:
      org.opengym.python-foundation: synthetic
      com.docker.compose.service: private

volumes:
  postgres-data:
    labels:
      org.opengym.python-foundation: synthetic
      com.docker.compose.service: foundation-db
